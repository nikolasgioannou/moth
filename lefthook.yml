pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{js,ts,json,jsonc}"
      run: bunx biome check --write --error-on-warnings --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    - name: typecheck
      glob: "*.ts"
      run: bunx tsc --noEmit
    # Only when tickets change. moth is the product here, so a runtime fault
    # in src/ would otherwise block the very commit that fixes it; scoping
    # this to the ticket store keeps that collision to commits touching both.
    - name: moth check
      glob: ".moth/*.md"
      run: bun run moth check

commit-msg:
  jobs:
    - name: commitlint
      run: bunx commitlint --edit {1}
