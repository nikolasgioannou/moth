pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{js,ts,json,jsonc}"
      run: bunx biome check --write --error-on-warnings --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    - name: typecheck
      glob: "*.ts"
      run: bunx tsc --noEmit

commit-msg:
  jobs:
    - name: commitlint
      run: bunx commitlint --edit {1}
