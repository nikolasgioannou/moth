name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      # moth's own ticket store, validated by the moth in this commit. The pre-commit
      # hook only sees local commits; this also covers --no-verify, merges, and
      # edits made through the web UI.
      - run: bun run moth check
