name: release

# Publishing is deliberate: a release happens when a version tag is pushed,
# never on an ordinary commit.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # A release that has not been checked is worse than no release.
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test

      - name: Check the tag matches package.json
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared=$(bun -e 'console.log(require("./package.json").version)')
          if [ "$tagged" != "$declared" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $declared" >&2
            exit 1
          fi

      - name: Build every target
        run: bun run build:release

      # Notes come from the CHANGELOG section for this tag. If there is no such
      # section, fall back to generated notes rather than publishing an empty
      # release: a missing changelog entry should not break a release.
      - name: Take the release notes from the changelog
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 == "## [" v "]" || index($0, "## [" v "] ") == 1 { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "no CHANGELOG section for $version; falling back to generated notes"
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_FOUND: ${{ steps.notes.outputs.found }}
        run: |
          if [ "$NOTES_FOUND" = "true" ]; then
            set -- --notes-file notes.md
          else
            set -- --generate-notes
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            "$@" \
            dist/release/moth-* \
            dist/release/SHA256SUMS

  # Keeps the Homebrew formula pointing at the release that was just published.
  # Skips rather than fails when the tap token is absent, so a release is never
  # marked broken for want of a secret.
  bump-tap:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Check for the tap token
        id: token
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set; skipping the formula bump" >> "$GITHUB_STEP_SUMMARY"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout the tap
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          repository: nikolasgioannou/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Bump the formula
        if: steps.token.outputs.present == 'true'
        run: ./scripts/bump-formula.sh moth "$GITHUB_REF_NAME"

      - name: Commit and push
        if: steps.token.outputs.present == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "no formula changes to commit"
            exit 0
          fi
          git add Formula/moth.rb
          git commit -m "moth $GITHUB_REF_NAME"
          git push

  # Publishing to npm is irreversible for a given version, so it is gated on the
  # same deliberate act as everything else: pushing a version tag. It skips when
  # no token is configured rather than failing the release.
  publish-npm:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Check for the npm token
        id: token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "NPM_TOKEN is not set; skipping the npm publish" >> "$GITHUB_STEP_SUMMARY"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'
      - uses: oven-sh/setup-bun@v2
        if: steps.token.outputs.present == 'true'
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Build the packages
        if: steps.token.outputs.present == 'true'
        run: |
          bun install --frozen-lockfile
          bun run build:npm "${GITHUB_REF_NAME#v}"

      # Platform packages first: the wrapper depends on them by exact version, so
      # publishing it first would briefly point at versions that do not exist.
      - name: Publish
        if: steps.token.outputs.present == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in dist/npm/moth-cli-*; do
            npm publish "$dir" --access public
          done
          npm publish dist/npm/moth-cli --access public
